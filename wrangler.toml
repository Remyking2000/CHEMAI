# ==============================================================================
# ChemAI Cloudflare Deployment Configuration
# Compatible with both Cloudflare Workers (with Assets) and Cloudflare Pages
# ==============================================================================
name = "chemai"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "frontend/dist"
not_found_handling = "single-page-application"

[ai]
binding = "AI"

# Default environment variables (non-secret)
[vars]
AI_PROVIDER = "openrouter"
GEMINI_MODEL = "gemini-2.5-flash"
OPENROUTER_MODEL = "openrouter/free"

# ==============================================================================
# Cloudflare D1 SQL Database Binding
# Once D1 permission is added to your token, run: npx wrangler d1 create chemai-db
# Then uncomment this block and paste the database_id UUID.
# ==============================================================================
# [[d1_databases]]
# binding = "DB"
# database_name = "chemai-db"
# database_id = "chemai-d1-placeholder-id"
# migrations_dir = "migrations"
