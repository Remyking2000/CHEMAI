# ==============================================================================
# ChemAI Cloudflare Pages Configuration
# ==============================================================================
name = "chemai"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "frontend/dist"

# Default environment variables (non-secret)
[vars]
AI_PROVIDER = "openrouter"
OPENROUTER_MODEL = "liquid/lfm-2.5-2.6b:free"
GEMINI_MODEL = "gemini-2.5-flash"

# ==============================================================================
# Cloudflare D1 SQL Database Binding
# Once D1 permission is added to your token, run: npx wrangler d1 create chemai-db
# Then uncomment this block and paste the database_id UUID.
# ==============================================================================
# [[d1_databases]]
# binding = "DB"
# database_name = "chemai-db"
# database_id = "chemai-d1-placeholder-id"
# migrations_dir = "migrations"
